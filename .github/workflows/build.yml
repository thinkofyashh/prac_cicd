name: build for pr

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          # ❌ Removed: cache: 'pnpm' (this was causing the issue)

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.0.0
          run_install: false  # Prevents auto-install, we'll install manually

      - name: Install dependencies
        run: pnpm install

      - name: Run build
        run: pnpm dlx turbo run build





